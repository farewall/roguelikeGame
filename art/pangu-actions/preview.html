<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>盘古 · 四向动作预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#11191c;color:#ebe2cd;font-family:system-ui,-apple-system,"PingFang SC",sans-serif}main{max-width:1180px;margin:auto;padding:36px 24px}h1{font:36px Georgia,"Songti SC",serif;letter-spacing:5px;margin:10px 0}p{color:#b6bcb4;line-height:1.8}small{color:#a0aaa1}.tag{font-size:12px;letter-spacing:3px;color:#d2b578}header{border-bottom:1px solid #37433e;padding-bottom:22px;margin-bottom:22px}button,select{background:#1f2d2d;border:1px solid #5b6555;color:#e7dfc7;border-radius:5px;padding:10px 16px;cursor:pointer;font:inherit}button.active{color:#19201e;background:#d0b778;border-color:#d0b778}button:focus-visible,input:focus-visible{outline:2px solid #ffe2a2;outline-offset:3px}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}.controls label{display:flex;gap:8px;align-items:center}input[type=range]{accent-color:#d0b778}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #35413a;border-radius:8px;background:#172322;overflow:hidden}.card h2{font-size:17px;font-weight:500;margin:16px 18px 4px}.card p{font-size:12px;margin:0 18px 14px}.card canvas{display:block;width:100%;height:auto;background:radial-gradient(ellipse at 50% 70%,#33403a,#172322 70%)}.card footer{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-top:1px solid #35413a}.card a{color:#ddc78c;font-size:13px;text-decoration:none}.demo{margin-top:30px;border:1px solid #35413a;border-radius:8px;padding:20px}.demo h2{font-size:22px;font-weight:500;margin:0 0 8px}#stage{display:block;width:100%;height:auto;border-radius:6px;background:radial-gradient(ellipse,#35463c,#172522 70%);touch-action:none;cursor:crosshair}#status{font-size:13px;color:#c8ba8e;min-height:24px}.muted{font-size:13px;color:#a0aaa1}.note{margin:24px 0 0;font-size:13px}kbd{border:1px solid #556351;border-radius:3px;padding:1px 4px}#directions{display:flex;gap:8px}#scrub{width:130px}@media(max-width:760px){.grid{grid-template-columns:repeat(2,1fr)}main{padding:24px 14px}h1{font-size:28px}.controls{gap:7px}button{padding:9px 12px}}@media(max-width:430px){.grid{gap:10px}.card h2{margin-left:12px}.card p{margin-left:12px;font-size:11px}}
</style>
<main>
<header><div class="tag">开天一念 / 人物动作稿 01</div><h1>盘古 · 四向动作</h1><p>同一角色，六组动作，上下左右四个朝向。移动跟随行进方向，挥斧朝向攻击目标。</p><small>本地素材预览 · 未上传微信 · 每组 24 帧，共 144 帧</small></header>
<div class="controls"><span>观看方向</span><div id="directions"><button data-dir="down" class="active">正面 ↓</button><button data-dir="up">背面 ↑</button><button data-dir="left">左侧 ←</button><button data-dir="right">右侧 →</button></div></div>
<div class="controls"><button id="pause">暂停</button><label>速度 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="1.5">1.5×</option></select></label><label>逐帧 <input type="range" id="scrub" min="0" max="5" step="1" value="0"></label><small>非循环动作在此重复播放，便于检查收势。</small></div>
<section class="grid" id="cards"></section>
<section class="demo"><h2>转向与攻击试演</h2><p class="muted">用 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 或方向键连续移动；点击场地，让盘古朝点击位置挥斧。攻击结束后恢复移动朝向。</p><canvas id="stage" width="1060" height="440" aria-label="盘古移动与攻击方向预览"></canvas><div id="status">正在载入动作帧…</div><div class="controls"><button id="hit">受击</button><button id="awaken">升级觉醒</button><button id="death">神念消散</button><button id="reset">重新开始</button></div><small>触屏可使用下面的方向按钮，点击场地进行攻击。</small><div class="controls" id="touch-directions"><button data-x="-1" data-y="0">←</button><button data-x="0" data-y="-1">↑</button><button data-x="0" data-y="1">↓</button><button data-x="1" data-y="0">→</button></div></section>
<p class="note">精灵图每张 1536 × 1024，6 列 × 4 行，单格 256 × 256。行序：正面、背面、左侧、右侧。该页面仅展示动画与转向，尚未接入小程序战斗。</p>
</main>
<script src="controller.cjs"></script>
<script>
const names={idle:'待机',move:'移动',attack:'普通攻击',hurt:'受击',awaken:'升级觉醒',death:'神念消散'};
const descriptions={idle:'呼吸与毛发微动 · 循环',move:'交替迈步 · 连续移动循环',attack:'准备 → 蓄力 → 出斧 → 收势',hurt:'后仰 → 缓冲 → 恢复姿态',awaken:'聚气 → 神纹亮起 → 回落',death:'虚弱 → 跪地 → 化为墨尘'};
const row={down:0,up:1,left:2,right:3}, images={}, cards=[];
let dir='down',playing=true,speed=1,elapsed=0,last=0,loaded=false,controller=new PanguActions.PanguAnimation();
const stage=document.querySelector('#stage'),ctx=stage.getContext('2d'),position={x:530,y:250},keys=new Set();
let touchVector=null,target=null;
document.querySelector('#cards').innerHTML=Object.keys(names).map(k=>`<article class="card"><h2>${names[k]}</h2><p>${descriptions[k]}</p><canvas width="320" height="300" data-action="${k}"></canvas><footer><small data-frame="${k}">6 帧 × 4 向</small><a href="${k}.png" download="pangu-${k}.png">下载精灵图 ↗</a></footer></article>`).join('');
document.querySelectorAll('[data-action]').forEach(canvas=>cards.push({canvas,ctx:canvas.getContext('2d'),action:canvas.dataset.action}));
const readiness=Promise.all(Object.keys(names).map(k=>new Promise((resolve,reject)=>{const img=new Image();images[k]=img;img.onload=()=>resolve();img.onerror=()=>reject(new Error(k+'素材加载失败'));img.src=k+'.png';}))).then(()=>{loaded=true;document.body.dataset.assets='ready';}).catch(e=>{document.querySelector('#status').textContent=e.message;document.body.dataset.assets='failed';});
document.querySelectorAll('[data-dir]').forEach(b=>b.onclick=()=>{dir=b.dataset.dir;document.querySelectorAll('[data-dir]').forEach(x=>x.classList.toggle('active',x===b));});
document.querySelector('#pause').onclick=()=>{playing=!playing;document.querySelector('#pause').textContent=playing?'暂停':'继续播放';};
document.querySelector('#speed').onchange=e=>speed=Number(e.target.value);
document.querySelector('#scrub').oninput=()=>{playing=false;document.querySelector('#pause').textContent='继续播放';};
function draw(context,action,direction,frame,x,y,size){const im=images[action];context.drawImage(im,frame*256,row[direction]*256,256,256,x-size/2,y-size*.94,size,size);}
function reset(){controller=new PanguActions.PanguAnimation();position.x=530;position.y=250;target=null;keys.clear();touchVector=null;}
document.querySelector('#hit').onclick=()=>controller.hurt();document.querySelector('#awaken').onclick=()=>controller.awaken();document.querySelector('#death').onclick=()=>controller.die();document.querySelector('#reset').onclick=reset;
addEventListener('keydown',e=>{if(e.target.matches('input,select'))return;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d','W','A','S','D'].includes(e.key)){e.preventDefault();keys.add(e.key.toLowerCase());}});
addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>{keys.clear();touchVector=null;});
stage.addEventListener('pointerdown',e=>{const r=stage.getBoundingClientRect();target={x:(e.clientX-r.left)*stage.width/r.width,y:(e.clientY-r.top)*stage.height/r.height};controller.attack(target.x-position.x,target.y-position.y);});
document.querySelectorAll('#touch-directions button').forEach(b=>{b.style.touchAction='none';b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);touchVector={x:Number(b.dataset.x),y:Number(b.dataset.y)};};b.onpointerup=b.onpointercancel=()=>touchVector=null;});
function loop(now){const dt=last?Math.min(.05,(now-last)/1000):0;last=now;if(playing)elapsed+=dt*speed;
if(loaded){for(const c of cards){const frame=playing?Math.floor(elapsed*PanguActions.clips[c.action].fps)%6:Number(document.querySelector('#scrub').value);c.ctx.clearRect(0,0,c.canvas.width,c.canvas.height);draw(c.ctx,c.action,dir,frame,160,285,272);document.querySelector(`[data-frame="${c.action}"]`).textContent=`第 ${frame+1} / 6 帧 · ${dir==='down'?'正面':dir==='up'?'背面':dir==='left'?'左侧':'右侧'}`;}
let dx=(keys.has('d')||keys.has('arrowright')?1:0)-(keys.has('a')||keys.has('arrowleft')?1:0),dy=(keys.has('s')||keys.has('arrowdown')?1:0)-(keys.has('w')||keys.has('arrowup')?1:0);if(touchVector){dx=touchVector.x;dy=touchVector.y;}const len=Math.hypot(dx,dy);if(len){dx/=len;dy/=len;}if(controller.state!=='death'&&controller.state!=='awaken'&&controller.state!=='hurt'){position.x=Math.max(80,Math.min(980,position.x+dx*180*dt));position.y=Math.max(190,Math.min(420,position.y+dy*180*dt));}controller.move(dx,dy);const f=controller.update(dt);ctx.clearRect(0,0,stage.width,stage.height);ctx.strokeStyle='#63705b55';ctx.beginPath();ctx.ellipse(position.x,position.y-2,38,10,0,0,Math.PI*2);ctx.stroke();if(target){ctx.strokeStyle='#d2b57899';ctx.beginPath();ctx.moveTo(target.x-7,target.y);ctx.lineTo(target.x+7,target.y);ctx.moveTo(target.x,target.y-7);ctx.lineTo(target.x,target.y+7);ctx.stroke();}draw(ctx,f.action,f.direction,f.index,position.x,position.y,200);document.querySelector('#status').textContent=`${names[f.action]} · ${f.direction==='down'?'朝下':f.direction==='up'?'朝上':f.direction==='left'?'朝左':'朝右'} · 第 ${f.index+1} 帧`;}
requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script>
</html>
