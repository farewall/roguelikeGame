name: WeChat Mini Game playtest
on:
  workflow_dispatch:
  push:
    branches:
      - 'wechat-playtest/**'
permissions:
  contents: read
concurrency:
  group: wechat-minigame-playtest
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/wechat-ci/package-lock.json
      - name: Install pinned game framework
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build and validate Mini Game
        run: |
          npm run build
          npm test
          node --check minigame/game.js
      - name: Install pinned browser check runner
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Validate Canvas attacks and native touch
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
        run: node tools/preview.test.cjs
      - name: Save Canvas verification screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: canvas-checks
          path: /tmp/pangu-minigame/*.png
          if-no-files-found: ignore
          retention-days: 1
      - name: Install official WeChat CI
        if: success()
        run: npm ci --prefix tools/wechat-ci --no-audit --no-fund
      - name: Upload Mini Game and generate preview QR
        env:
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          WECHAT_VERSION: 0.3.${{ github.run_number }}
        run: node tools/wechat-ci/upload.cjs
      - name: Save Mini Game preview QR
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wechat-preview
          path: wechat-preview/qrcode.png
          if-no-files-found: error
          retention-days: 1
