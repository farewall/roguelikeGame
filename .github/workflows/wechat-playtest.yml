name: WeChat playtest
on:
  workflow_dispatch:
  push:
    branches:
      - 'wechat-playtest/**'
permissions:
  contents: read
concurrency:
  group: wechat-playtest
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tools/wechat-ci/package-lock.json
      - name: Check source syntax
        run: |
          node --check miniprogram/app.js
          node --check miniprogram/pages/index/index.js
          node --check miniprogram/lib/pangu-animation.js
          node --test tools/game.test.cjs
      - name: Install official WeChat CI
        run: npm ci --prefix tools/wechat-ci --no-audit --no-fund
      - name: Upload development version and generate preview QR
        env:
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          WECHAT_VERSION: 0.1.${{ github.run_number }}
        run: node tools/wechat-ci/upload.cjs
      - name: Save preview QR code
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wechat-preview
          path: wechat-preview/qrcode.png
          if-no-files-found: error
          retention-days: 1
