name: Recover verified WeChat upload
on:
  push:
    branches:
      - 'upload-recovery/growth-bell-20261106'
permissions:
  contents: read
  actions: read
concurrency:
  group: cocos-wechat-playtest
  cancel-in-progress: false
jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify original build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/farewall/roguelikeGame/actions/runs/42178926857 > /tmp/original-run.json
          node -e "const r=require('/tmp/original-run.json');if(r.head_sha!=='64d998054b5a85556033a73e8c873faf0515794f')throw Error('Unexpected build source');console.log('Reusing officially exported and visually verified gameplay build',r.head_sha)"
      - name: Restore verified official Creator builds
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cocos-builds
          path: .
          github-token: ${{ github.token }}
          run-id: 42178926857
      - name: Verify package budgets and uploader
        env:
          GITHUB_SHA: 64d998054b5a85556033a73e8c873faf0515794f
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          GITHUB_SHA=64d998054b5a85556033a73e8c873faf0515794f npm run test:package
          node tools/package-budget.cjs
          node --test tools/minigame.test.cjs
          npm ci --prefix tools/wechat-ci --no-audit --no-fund
      - name: Upload via supported HTTP mode and generate QR
        env:
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          WECHAT_PRIVATE_KEY: ${{ secrets.WECHAT_PRIVATE_KEY }}
          WECHAT_VERSION: 0.4.23
          GITHUB_SHA: 64d998054b5a85556033a73e8c873faf0515794f
        run: GITHUB_SHA=64d998054b5a85556033a73e8c873faf0515794f node tools/wechat-ci/upload.cjs
      - name: Save WeChat preview QR
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wechat-preview
          path: wechat-preview/qrcode.png
          if-no-files-found: error
          retention-days: 1
