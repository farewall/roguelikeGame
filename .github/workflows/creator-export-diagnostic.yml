name: Diagnose saved Creator export
on:
  push:
    branches: ['codex/wechat-render-diagnostic-20261124']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cocos-builds
          path: .
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: '45459086331'
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - run: sudo apt-get install -y --no-install-recommends fonts-noto-cjk
      - run: npm run test:visual
        env:
          CHROMIUM_EXECUTABLE: /usr/bin/google-chrome
