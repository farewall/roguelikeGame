name: Cocos input diagnostics
on:
  push:
    branches: ['cocos-diagnostics/**']
permissions:
  contents: read
  actions: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: '22' }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: cocos-builds
          run-id: 41792862379
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund playwright@1.58.2
      - name: Read actual engine input events
        env: { CHROMIUM_EXECUTABLE: /usr/bin/google-chrome }
        run: node tools/cocos/diagnose.cjs
